name: Test Naukri Jobs API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Run unit tests
        run: pytest -q
      - name: Verify application imports
        run: python -c "from app.main import app; assert app.title == 'Naukri Jobs API'"

# Live Naukri collection is intentionally excluded from CI because upstream
# behavior depends on the execution environment. Run the bundled local live
# verification only from an environment where public Naukri pages are reachable.
